<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Central de Comando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ---------- tokens ---------- */
:root {
  --bg: #f4f3ef; --surface: #ffffff; --surface-2: #faf9f6; --ink: #1b1a17; --ink-2: #5d5b55; --ink-3: #6e6b63;
  --line: #e4e2db; --line-2: #d2cfc6; --chip: #efede7;
  --accent: #2460b8; --accent-ink: #ffffff; --accent-soft: #e4edfa;
  --good: #177535; --good-soft: #e3f3e7; --warning: #8f5a0c; --warning-soft: #fbf0d9; --critical: #c0352f; --critical-soft: #fbe4e2; --estado-ink: #ffffff;
  --servicos: #2460b8; --video: #c84a2a; --produtos: #6d4bc4; --cafe: #8a5a2b; --tortas: #bf3a73; --monitor: #0f7f7a; --global: #6b6861;
  --sombra: 0 1px 2px rgba(27, 26, 23, .06), 0 6px 18px -8px rgba(27, 26, 23, .14);
  --raio: 12px; --raio-s: 8px;
  --saida: cubic-bezier(.16, 1, .3, 1);
  --t-rapido: 150ms; --t-normal: 220ms; --t-vista: 320ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121311; --surface: #1b1c19; --surface-2: #202120; --ink: #efeee9; --ink-2: #b4b1a8; --ink-3: #8f8c82;
    --line: #2e2f2b; --line-2: #3d3e39; --chip: #272824;
    --accent: #6a9ff0; --accent-ink: #0f1a2e; --accent-soft: #1b2a45;
    --good: #5cc07a; --good-soft: #17301f; --warning: #e0a94a; --warning-soft: #342812; --critical: #ee7a72; --critical-soft: #3a1c1a; --estado-ink: #121311;
    --servicos: #6a9ff0; --video: #f07a5c; --produtos: #a88cf0; --cafe: #c99560; --tortas: #e87bab; --monitor: #4fc3bb; --global: #a19d93;
    --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -10px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}
::selection { background: var(--accent-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--accent); text-underline-offset: 3px; }
a.canal { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--ink-3, var(--ink-2)); }
a.canal:hover { color: var(--accent); border-bottom-color: var(--accent); }
a.canal .ico { width: 11px; height: 11px; margin-left: 3px; vertical-align: -1px; opacity: .6; }
a.canal:hover .ico { opacity: 1; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 22px; font-weight: 600; }
h2 { font-size: 17px; font-weight: 600; }
::placeholder { color: var(--ink-2); opacity: 1; }
h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
p { margin: 0; }
code { font: 12.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; }
.ico { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; flex: none; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::-webkit-scrollbar { height: 8px; width: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 2px solid var(--bg); }

/* ---------- topo e navegação ---------- */
.topo {
  position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topo-linha { max-width: 1320px; margin: 0 auto; padding: 10px 16px 0; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.marca .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.marca .logo .ico { width: 16px; height: 16px; }
.marca small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 400; }
.estado-agentes { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); padding: 4px 10px 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.ponto.vivo { background: var(--good); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); animation: pulso 2.2s var(--saida) infinite; }
.ponto.parado { background: var(--critical); }
@keyframes pulso { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.sync { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.sync .ponto { width: 6px; height: 6px; transition: background var(--t-rapido); }
.sync.piscou .ponto { background: var(--accent); }
.nav { max-width: 1320px; margin: 0 auto; padding: 6px 8px 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.aba {
  position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 8px 10px 10px; border-radius: 8px 8px 0 0;
  color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; min-height: 40px;
  transition: color var(--t-rapido), background var(--t-rapido);
}
.aba:hover { color: var(--ink); background: var(--chip); }
.aba[aria-current="page"] { color: var(--ink); }
.aba[aria-current="page"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--cor, var(--ink)); border-radius: 2px 2px 0 0; }
.aba .ponto { background: var(--cor, var(--ink-3)); }
.aba .count { margin-left: -2px; }

/* ---------- layout ---------- */
main { max-width: 1320px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); align-items: start; }
main.uma { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 960px) { main { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
section.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio); padding: 16px; min-width: 0; box-shadow: var(--sombra); }
section.painel > h2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
section.painel > h2 .direita { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
.count { font-size: 12px; font-weight: 500; background: var(--chip); border-radius: 999px; padding: 1px 8px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.count.alerta { background: var(--critical-soft); color: var(--critical); }
.meta { font-size: 12.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.meta .ico { color: var(--ink-3); }
.chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--ink); display: inline-flex; align-items: center; gap: 5px; }
.chip .ponto { width: 6px; height: 6px; }
.vazio { color: var(--ink-3); font-size: 14px; }
.aviso { background: var(--warning-soft); color: var(--ink); border-radius: var(--raio-s); padding: 10px 12px; font-size: 13.5px; display: flex; gap: 8px; align-items: flex-start; }
.aviso .ico { color: var(--warning); margin-top: 3px; }
.aviso.erro { background: var(--critical-soft); } .aviso.erro .ico { color: var(--critical); }
.aviso.neutro { background: var(--chip); } .aviso.neutro .ico { color: var(--ink-2); }
.lista { list-style: none; margin: 0; padding: 0; }
.lista li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lista li:last-child { border-bottom: 0; padding-bottom: 0; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); margin-top: 12px; list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; }
details summary::-webkit-details-marker { display: none; }
details summary .ico { transition: transform var(--t-normal) var(--saida); }
details[open] summary .ico { transform: rotate(90deg); }
details summary:hover { color: var(--ink); }

/* ---------- controles ---------- */
button, select, textarea, input { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--raio-s); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; transition: background var(--t-rapido), border-color var(--t-rapido), transform var(--t-rapido), opacity var(--t-rapido); touch-action: manipulation; }
.btn:hover { background: var(--chip); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primario:hover { filter: brightness(1.08); }
.btn.perigo:hover { border-color: var(--critical); color: var(--critical); background: var(--critical-soft); }
.btn.pequeno { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.ocupado .ico { animation: giro 1s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
textarea, select, input { width: 100%; border: 1px solid var(--line-2); border-radius: var(--raio-s); background: var(--surface-2); padding: 9px 11px; transition: border-color var(--t-rapido), box-shadow var(--t-rapido); }
textarea:focus, select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 76px; resize: vertical; }
label { font-size: 13px; color: var(--ink-2); display: block; margin-bottom: 4px; font-weight: 500; }
.badge { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-2); border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 500; min-height: 22px; line-height: 1; white-space: nowrap; }
.badge .ico { width: 12px; height: 12px; }
.badge.good { border-color: transparent; background: var(--good-soft); color: var(--good); }
.badge.warning { border-color: transparent; background: var(--warning-soft); color: var(--warning); }
.badge.critical { border-color: transparent; background: var(--critical-soft); color: var(--critical); }
.badge.muted { color: var(--ink-2); }
.badge.auto { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.badge.compra { background: var(--good); border-color: var(--good); color: var(--estado-ink); font-weight: 600; }
.badge.venda { background: var(--critical); border-color: var(--critical); color: var(--estado-ink); font-weight: 600; }
.grade-cartoes { display: grid; gap: 0; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.grade-cartoes .cartao { border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 14px; }
.cartao { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); min-width: 0; }
.cartao .titulo { font-weight: 600; }
.cartao + .cartao { margin-top: 10px; }
.grade-cartoes .cartao + .cartao { margin-top: 0; }

/* ---------- faixa de resumo ---------- */
.faixa { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio); overflow: hidden; box-shadow: var(--sombra); }
.faixa > div { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.faixa .rotulo { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.faixa .valor { font-size: 26px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.faixa .valor small { font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; margin-left: 4px; }
.faixa .sub { font-size: 12px; color: var(--ink-3); }

/* ---------- decisões ---------- */
.decisao { padding: 14px 0; display: flex; flex-direction: column; gap: 8px; transition: opacity var(--t-normal), transform var(--t-normal) var(--saida), border-color var(--t-rapido); }
.decisao + .decisao { border-top: 1px solid var(--line); }
.decisao:first-child { padding-top: 4px; }
.decisao.saindo { opacity: 0; transform: translateX(16px) scale(.98); }
.decisao .titulo { font-weight: 600; font-size: 15px; }
.decisao .reco { font-size: 14px; border-top: 1px dashed var(--line); padding-top: 8px; display: flex; gap: 8px; }
.decisao .reco .ico { color: var(--accent); margin-top: 3px; }
.impacto { display: inline-flex; gap: 2px; align-items: center; }
.impacto i { width: 5px; height: 10px; border-radius: 2px; background: var(--line-2); display: inline-block; }
.impacto i.on { background: var(--ink-2); }

/* ---------- projetos (visão geral) ---------- */
.proj-lista { display: flex; flex-direction: column; }
.proj { display: block; border-radius: 8px; text-decoration: none; color: inherit; transition: background var(--t-rapido); }
.proj + .proj { border-top: 1px solid var(--line); }
.proj:hover { background: var(--surface-2); }
.proj .ponto { background: var(--cor); }
.proj .corpo { padding: 12px 6px; display: grid; gap: 8px 16px; grid-template-columns: minmax(0, 1.2fr) minmax(190px, 1fr); align-items: center; }
@media (max-width: 640px) {
  .proj .corpo { grid-template-columns: minmax(0, 1fr); }
  .nav { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); padding-right: 32px; }
}
.proj .nome { font-weight: 600; display: block; }
.proj .nome .ponto { display: inline-block; margin-right: 8px; vertical-align: middle; }
.proj .nome .badge { margin-left: 6px; vertical-align: middle; }
.proj .fase { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.proj .numeros { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.proj .numeros b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.proj .seta { color: var(--ink-3); justify-self: end; align-self: start; }

/* ---------- gráfico bala (realizado × meta) ---------- */
.bala { display: grid; gap: 4px; min-width: 0; }
.bala .rotulos { display: flex; flex-wrap: wrap; justify-content: space-between; font-size: 12px; color: var(--ink-2); gap: 0 12px; }
.bala .rotulos b { color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bala .rotulos span { white-space: nowrap; }
.bala .trilho { position: relative; height: 10px; border-radius: 5px; background: var(--chip); overflow: visible; }
.bala .faixa-cenarios { position: absolute; top: 0; bottom: 0; background: var(--line-2); border-radius: 5px; opacity: .7; }
.bala .barra { position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 3px; background: var(--cor, var(--accent)); transform-origin: left center; }
.bala .marca { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; transform: translateX(-1px); }
.entrada .bala .barra { animation: cresce .7s var(--saida) both; }
@keyframes cresce { from { transform: scaleX(0); } }

/* ---------- detalhe do projeto ---------- */
.cabecalho-proj { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 16px; padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: var(--raio); background: linear-gradient(135deg, color-mix(in srgb, var(--cor) 10%, var(--surface)), var(--surface) 60%); box-shadow: var(--sombra); }
.cabecalho-proj .voltar { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-size: 13px; min-height: 32px; }
.cabecalho-proj .voltar:hover { color: var(--ink); }
.cabecalho-proj h1 { font-size: 22px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.cabecalho-proj h1 .ponto { width: 12px; height: 12px; background: var(--cor); }
.cabecalho-proj .bloco { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.cabecalho-proj .resumo { font-size: 14px; color: var(--ink-2); max-width: 70ch; }
.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 0; }
.indicador { padding: 2px 14px 2px 12px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.indicador:first-child { border-left: 0; padding-left: 0; }
.indicador .rotulo { font-size: 12px; color: var(--ink-2); }
.indicador .valor { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.indicador .sub { font-size: 12px; color: var(--ink-3); }

/* ---------- gráfico de linha ---------- */
.grafico { width: 100%; min-width: 0; }
.grafico > svg { width: 100%; height: auto; display: block; overflow: visible; }
.grafico .eixo { stroke: var(--line-2); stroke-width: 1; }
.grafico .grade { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.grafico text { font: 11px Inter, sans-serif; fill: var(--ink-2); }
.grafico .banda { fill: var(--cor, var(--accent)); opacity: .10; }
.grafico .linha-real { stroke: var(--cor, var(--accent)); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.grafico .linha-realista { stroke: var(--ink-2); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
.grafico .linha-limite { stroke: var(--ink-3); stroke-width: 1; fill: none; stroke-dasharray: 1.5 3; }
.grafico .ponto-real { fill: var(--surface); stroke: var(--cor, var(--accent)); stroke-width: 2; }
.grafico .hoje { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.grafico .marco { fill: var(--ink-2); font-weight: 500; }
.entrada .grafico .linha-real { stroke-dasharray: 1; stroke-dashoffset: 1; animation: traca .9s var(--saida) .15s both; }
.entrada .grafico .linha-realista, .entrada .grafico .linha-limite { animation: aparece .6s ease-out .3s both; }
.entrada .grafico .banda { animation: aparece .6s ease-out .3s both; }
@keyframes traca { to { stroke-dashoffset: 0; } }
@keyframes aparece { from { opacity: 0; } }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda svg { width: 22px; height: 10px; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.tabela th, .tabela td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tabela th:first-child, .tabela td:first-child { text-align: left; }
.tabela th { color: var(--ink-2); font-weight: 500; }

/* ---------- KPIs ---------- */
.kpi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.kpi:last-child { border-bottom: 0; }
.kpi .nome { font-size: 14px; }
.kpi .bala { grid-column: 1 / -1; }
.kpi .estado { font-size: 12px; }

/* ---------- pendências ---------- */
.pend-grupo h3 { margin: 14px 0 6px; }
.pend-grupo:first-child h3 { margin-top: 0; }
.pend { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: start; }
.pend:last-child { border-bottom: 0; }
.pend .chk { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; margin-top: 2px; color: var(--good); }
.pend.feita .chk { border-color: var(--good); background: var(--good-soft); }
.pend.feita .texto { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
.pend .texto { overflow-wrap: anywhere; }
.pend .meta { margin-top: 2px; }
.resp { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 6px; font-size: 11.5px; font-weight: 600; }
.progresso { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.progresso i { display: block; height: 100%; background: var(--cor, var(--good)); border-radius: 3px; transform-origin: left; }
.entrada .progresso i { animation: cresce .7s var(--saida) both; }

/* ---------- monitor ---------- */
.sinais { border-top: 1px dashed var(--line-2); padding-top: 8px; }
.sinais .lista li { border-bottom-color: var(--line); }
.placar-barra { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--chip); margin: 6px 0 2px; }
.placar-barra i { display: block; height: 100%; transform-origin: left; }
.placar-barra .w { background: var(--good); } .placar-barra .l { background: var(--critical); } .placar-barra .o { background: var(--line-2); }
.entrada .placar-barra i { animation: cresce .7s var(--saida) both; }
.ao-vivo { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- atividade ---------- */
.evento { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.evento:last-child { border-bottom: 0; }
.evento .ponto { margin-top: 7px; background: var(--cor, var(--ink-3)); }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.filtros .btn { min-height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 999px; }
.filtros .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- login e carregamento ---------- */
#login { max-width: 420px; margin: 80px auto; }
.erro { color: var(--critical); font-size: 13px; }
.esqueleto { position: relative; overflow: hidden; background: var(--chip); border-radius: 8px; min-height: 14px; }
.esqueleto::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 70%, transparent), transparent); animation: brilho 1.4s 8; }
@keyframes brilho { to { transform: translateX(100%); } }
.carregando { max-width: 1320px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.carregando .esqueleto { height: 120px; }

/* ---------- transições de vista ---------- */
.entrada > .col > *, .entrada.uma > * { animation: surge var(--t-vista) var(--saida) both; }
.entrada > .col > :nth-child(2), .entrada.uma > :nth-child(2) { animation-delay: 40ms; }
.entrada > .col > :nth-child(3), .entrada.uma > :nth-child(3) { animation-delay: 80ms; }
.entrada > .col > :nth-child(n+4), .entrada.uma > :nth-child(n+4) { animation-delay: 120ms; }
@keyframes surge { from { opacity: 0; transform: translateY(6px); } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 180ms; }

/* agentes de sinais (#/agentes): o eixo zero (ganho à direita, perda à esquerda, sempre com o valor escrito) */
.zero { display: inline-flex; align-items: center; gap: 8px; }
.zero .trilho { position: relative; width: 112px; height: 10px; flex: none; }
.zero .trilho::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink-3); }
.zero .trilho i { position: absolute; top: 0; bottom: 0; }
.zero.ganho .trilho i { left: 50%; background: var(--good); border-radius: 0 3px 3px 0; transform-origin: left; }
.zero.perda .trilho i { right: 50%; background: var(--critical); border-radius: 3px 0 0 3px; transform-origin: right; }
.zero b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.zero.ganho b { color: var(--good); } .zero.perda b { color: var(--critical); } .zero.zero b { color: var(--ink-2); }
.entrada .zero .trilho i { animation: cresce .7s var(--saida) both; }
.rolagem { overflow-x: auto; }
.tabela th.col-zero, .tabela td.col-zero, .tabela td.agora { text-align: left; }
.tabela td.agora .detalhe { display: block; color: var(--ink-2); font-size: 12px; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabela.comparacao tr[aria-current] td { background: var(--accent-soft); }
.tabela.comparacao a { font-weight: 600; }
.ativo-nome { display: inline-flex; align-items: center; gap: 6px; }
.ctl-sl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cabecalho-proj .ctl-sl { flex: 0 1 auto; align-self: center; }
.ctl-sl + a { margin-left: 4px; }
.abas-agentes { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.abas-agentes a { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
.abas-agentes a:hover { color: var(--ink); }
.abas-agentes a[aria-current] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
section.agente > h2 .selos { display: inline-flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 500; }
section.agente h3 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; color: var(--ink); text-transform: none; letter-spacing: -0.01em; }
section.agente .faixa-agente { box-shadow: none; margin-top: 12px; border-radius: 0; border-left: 0; border-right: 0; background: transparent; }
.cabecalho-proj .resumo, .leitura p { text-wrap: pretty; }
.faixa .valor .pos { color: var(--good); } .faixa .valor .neg { color: var(--critical); }
.agente-grade { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px 28px; }
.leitura h3:first-child { margin-top: 20px; }
.lista.compacta li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; }
.lista.compacta li .ico { flex: none; margin-top: 3px; }
.leitura-fraco .ico { color: var(--critical); } .leitura-forte .ico { color: var(--good); }
.recortes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
.barras { list-style: none; margin: 0; padding: 0; }
.barras li { display: grid; grid-template-columns: 4.2em auto 1fr; align-items: center; gap: 10px; padding: 3px 0; font-size: 13px; }
.barras .rot { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.barras .meta { justify-content: flex-end; }
.desfechos { display: flex; gap: 2px; border-radius: var(--raio-s); overflow: hidden; font-size: 12px; font-weight: 500; min-height: 30px; }
.desfechos span { display: flex; align-items: center; padding: 0 10px; white-space: nowrap; min-width: fit-content; }
.desfechos .d-alvo { background: var(--good-soft); color: var(--good); }
.desfechos .d-stop { background: var(--critical-soft); color: var(--critical); }
.desfechos .d-expirado, .desfechos .d-nao_acionada, .desfechos .d-sem_dados { background: var(--chip); color: var(--ink-2); }
.grafico.saldo .linha-saldo { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.grafico.saldo .area { fill: var(--accent); opacity: .08; }
.grafico.saldo.negativo .linha-saldo { stroke: var(--critical); } .grafico.saldo.negativo .area { fill: var(--critical); }
.grafico.saldo .ponto-real { stroke: var(--accent); } .grafico.saldo.negativo .ponto-real { stroke: var(--critical); }
.grafico .zero-linha { stroke: var(--ink-3); }
.grafico .troca, .amostra-troca { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
.grafico .troca-rot { fill: var(--ink-2); font-weight: 600; }
.amostra-saldo { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.entrada .grafico .linha-saldo { stroke-dasharray: 1; stroke-dashoffset: 1; animation: traca .9s var(--saida) .15s both; }
@media (max-width: 900px) { .agente-grade, .recortes { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .zero .trilho { width: 72px; } .barras li { grid-template-columns: 3.6em auto; } .barras li .meta { grid-column: 2; justify-content: flex-start; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .ponto.vivo { box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 30%, transparent); }
  .entrada .grafico .linha-real, .entrada .grafico .linha-saldo { stroke-dasharray: none; }
}
